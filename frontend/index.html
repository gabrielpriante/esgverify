<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESGVerify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { font-family: 'IBM Plex Sans', sans-serif; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
      .risk-high  { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
      .risk-medium { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
      .risk-low   { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
      .sub-strong   { color: #166534; }
      .sub-moderate { color: #854d0e; }
      .sub-weak     { color: #9a3412; }
      .sub-none     { color: #991b1b; }
      .status-dot-green { background-color: #22c55e; }
      .status-dot-red   { background-color: #ef4444; }
      .status-dot-amber { background-color: #f59e0b; }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .pulse { animation: pulse-dot 1.5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 1s linear infinite; }
      .stage-active  { border-left: 3px solid #1d4ed8; background: #eff6ff; }
      .stage-done    { border-left: 3px solid #16a34a; background: #f0fdf4; }
      .stage-pending { border-left: 3px solid #d1d5db; background: #f9fafb; }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
